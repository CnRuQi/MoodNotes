<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 迷失方向</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* 404 页面专用样式，不影响主 CSS */
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .error-wrapper {
            text-align: center;
            position: relative;
            z-index: 10;
            padding: 40px;
        }

        /* 巨大的 404 文字 */
        .glitch-text {
            font-family: var(--font-serif); /* 使用你的艺术字体 */
            font-size: 180px;
            font-weight: 900;
            line-height: 1;
            margin: 0;
            /* 核心：文字透明，背景磨砂，透出后面的流光 */
            color: rgba(0, 0, 0, 0.05); 
            background: linear-gradient(135deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.3) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            /* 增加一点模糊阴影 */
            text-shadow: 0 10px 30px rgba(0,0,0,0.05);
            /* 动画 */
            animation: breathe 4s ease-in-out infinite;
        }

        .error-msg {
            font-size: 24px;
            color: #1d1d1f;
            margin-top: -20px;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .error-desc {
            color: var(--text-gray);
            margin-bottom: 40px;
            font-size: 16px;
        }

        /* 呼吸动画 */
        @media (max-width: 768px) {
            .glitch-text { font-size: 100px; }
            .error-msg { font-size: 20px; }
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.02); opacity: 0.4; }
        }
        
        /* 玻璃卡片增强 */
        .glass-box {
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 40px;
            padding: 60px 40px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

    <!-- 延续主页的流光背景，保持一致感 -->
    <div class="ambient-light">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="error-wrapper">
        <div class="glass-box">
            <h1 class="glitch-text">404</h1>
            <h2 class="error-msg">页面不知去向</h2>
            <p class="error-desc">
                我们试图寻找它，但除了思维的涟漪，<br>
                这里空无一物。
            </p>
            
            <a href="index.html" class="btn-submit" style="text-decoration:none; display:inline-block; padding: 12px 40px; box-shadow: 0 10px 20px rgba(0,0,0,0.1);">
                返回首页
            </a>
        </div>
    </div>

</body>
</html>
