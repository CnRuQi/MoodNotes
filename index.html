<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#EDE7D8">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23F6F1E4'/%3E%3Crect x='20' y='18' width='60' height='10' rx='3' fill='%23EBD68C'/%3E%3Crect x='20' y='35' width='60' height='3' fill='%23C2452D' opacity='.85'/%3E%3Crect x='20' y='41' width='60' height='3' fill='%23C2452D' opacity='.85'/%3E%3Crect x='20' y='52' width='44' height='4' rx='2' fill='%232B3A55' opacity='.75'/%3E%3Crect x='20' y='63' width='52' height='4' rx='2' fill='%232B3A55' opacity='.5'/%3E%3Ccircle cx='68' cy='72' r='11' fill='none' stroke='%23C2452D' stroke-width='3' opacity='.8'/%3E%3C/svg%3E">
    <title>心事借阅卡</title>
    <style>
        :root {
            /* 全站统一动效五件套 */
            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-in: cubic-bezier(0.7, 0, 0.84, 0);
            --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
            --dur-micro: 120ms;
            --dur-short: 220ms;
            --dur-long: 420ms;
            /* 借阅卡色板：60 卡纸米白 / 30 案桌暖木 / 10 钢笔·红戳点缀 */
            --color-focus: #3E5C8F;
            --bg-color: #EDE7D8;
            --grid-color: rgba(122, 96, 58, 0.06);
            --paper: #F6F1E4;
            --paper-deep: #EFE8D6;
            --ink: #2B3A55;
            --ink-soft: #6B5D4A;
            --ink-faint: #8A7A5E;
            --rule-red: rgba(194, 69, 45, 0.55);
            --card-line: rgba(107, 93, 74, 0.18);
            --stamp: #C2452D;
            --lend: #3E5C8F;
            --font-mono: "Cascadia Code", "Consolas", "Courier New", monospace;
            --spine-yellow: #EBD68C;
            --spine-pink: #E8BDC6;
            --spine-mint: #B5D4BC;
            --spine-blue: #B0C6E2;
            --spine-purple: #C9BADE;
            --spine-orange: #E5C29E;
            --card-shadow: 2px 6px 16px rgba(80, 62, 40, 0.14);
            --card-shadow-drag: 8px 22px 44px rgba(60, 44, 26, 0.28);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: "Kaiti SC", "STKaiti", "KaiTi", "DFKai-SB", "BiauKai", "Noto Serif CJK SC", serif;
            background-color: var(--bg-color);
            background-image:
                linear-gradient(0deg, var(--grid-color) 1px, transparent 0),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 0);
            background-size: 40px 40px;
            color: var(--ink);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: manipulation;
        }

        /* 案桌灯光：极轻暖光，服务「档案室」语境 */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 18% 12%, rgba(255, 222, 170, 0.14), transparent 42%),
                radial-gradient(circle at 84% 86%, rgba(120, 96, 58, 0.08), transparent 46%);
            pointer-events: none;
            z-index: 0;
        }

        #board {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        /* --- 馆牌 --- */
        .desk-plate {
            position: fixed;
            top: 18px;
            left: 24px;
            z-index: 9999;
            background: var(--paper);
            padding: 10px 16px 9px;
            border-radius: 4px;
            box-shadow: var(--card-shadow);
            transform: rotate(-1.2deg);
            border-top: 8px solid var(--spine-yellow);
        }

        .desk-name {
            display: block;
            font-size: 17px;
            letter-spacing: 6px;
            color: var(--ink);
        }

        .desk-sub {
            display: block;
            margin-top: 3px;
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 1px;
            color: var(--ink-faint);
        }

        @media (max-width: 760px) {
            .desk-plate { display: none; }
        }

        /* --- 借书卡 --- */
        .card {
            position: absolute;
            width: var(--card-w, 220px);
            min-height: var(--card-h, 140px);
            background-color: var(--paper);
            box-shadow: var(--card-shadow);
            opacity: 0;
            transform: rotate(var(--angle, 0deg)) scale(0.8);
            transform-origin: center top;
            transition:
                transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), /* 弹性人格保留 */
                opacity var(--dur-short) var(--ease-out),
                box-shadow var(--dur-short) var(--ease-out);
            touch-action: none;
            display: flex;
            flex-direction: column;
            cursor: grab;
        }

        /* 顶部书脊色条：六色索引头，卡面统一米白 */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 10px;
            background: var(--spine, var(--spine-yellow));
        }

        .card.appear {
            opacity: 1;
            transform: rotate(var(--angle, 0deg)) scale(1);
        }

        @media (hover: hover) {
            .card:hover {
                transform: translateY(-4px) rotate(var(--angle, 0deg)) scale(1.03);
                box-shadow: 0 12px 28px rgba(60, 44, 26, 0.2);
            }
        }

        .card.removing {
            opacity: 0;
            transform: rotate(var(--rm-angle, 5deg)) scale(0.4);
            filter: blur(2px);
            box-shadow: 0 0 0 rgba(60, 44, 26, 0);
            transition: transform 0.3s var(--ease-in), opacity 0.3s var(--ease-in), box-shadow 0.3s var(--ease-in), filter 0.3s var(--ease-in);
            pointer-events: none;
        }

        .card.hidden {
            opacity: 0;
            transform: rotate(var(--angle, 0deg)) scale(0.85);
            box-shadow: 0 0 0 rgba(60, 44, 26, 0);
            visibility: hidden;
            pointer-events: none;
            transition: transform 0.3s var(--ease-in), opacity 0.3s var(--ease-in), box-shadow 0.3s var(--ease-in), visibility 0s 0.3s;
        }

        .card.dragging {
            transition: none;
            transform: rotate(var(--angle, 0deg)) scale(1.04);
            box-shadow: var(--card-shadow-drag);
            cursor: grabbing;
            z-index: 9999 !important;
            will-change: transform, left, top;
        }

        /* 回形针变体 */
        .card-clip {
            display: none;
            position: absolute;
            top: -12px;
            left: 20px;
            width: 24px;
            height: 28px;
            transform: rotate(7deg);
            z-index: 2;
            filter: drop-shadow(0 1px 1px rgba(60, 44, 26, 0.2));
        }

        .shape-clip .card-clip { display: block; }

        /* 装订孔变体 */
        .shape-punch::after {
            content: '';
            position: absolute;
            left: 12px;
            top: 46px;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: var(--bg-color);
            box-shadow: inset 0 1px 2px rgba(60, 44, 26, 0.3), 0 46px 0 var(--bg-color), 0 47px 0 rgba(60, 44, 26, 0.12);
        }

        .shape-punch .card-body { padding-left: 36px; }

        .card-head,
        .card-body {
            position: relative;
            z-index: 1;
        }

        .card-head {
            display: flex;
            align-items: baseline;
            gap: 8px;
            padding: 20px 14px 6px;
        }

        .card-no {
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--ink-soft);
        }

        .card-date {
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 1px;
            color: var(--ink-faint);
            margin-left: auto;
        }

        .card-close {
            width: 24px;
            height: 24px;
            margin: -4px -6px -4px 0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0.45;
            font-size: 17px;
            line-height: 1;
            color: var(--ink);
            transition: opacity var(--dur-short) var(--ease-out), background var(--dur-short) var(--ease-out), color var(--dur-short) var(--ease-out);
        }

        .card-close:hover {
            opacity: 1;
            background: rgba(194, 69, 45, 0.12);
            color: var(--stamp);
        }

        /* 借书卡红色双线：母题的核心识别线 */
        .card-rule {
            height: 5px;
            margin: 0 14px;
            border-top: 1.5px solid var(--rule-red);
            border-bottom: 1px solid var(--rule-red);
        }

        .card-body {
            padding: 10px 16px 40px;
            font-size: 17px;
            line-height: 30px;
            color: var(--ink);
            word-wrap: break-word;
            white-space: pre-wrap;
            background-image:
                linear-gradient(var(--card-line) 1px, transparent 1px);
            background-size: 100% 30px;
            background-position: 0 10px;
        }

        /* --- 检索 --- */
        .search-wrap {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
        }

        .search-box {
            background: var(--paper);
            border: 1px solid rgba(107, 93, 74, 0.18);
            outline: none;
            border-radius: 4px;
            padding: 10px 20px 10px 42px;
            width: 200px;
            font-size: 14px;
            font-family: inherit;
            color: var(--ink);
            box-shadow: 0 4px 15px rgba(60, 44, 26, 0.12);
            transition: width var(--dur-short) var(--ease-out), box-shadow var(--dur-short) var(--ease-out), border-color var(--dur-short) var(--ease-out);
            touch-action: manipulation;
        }

        .search-box:focus {
            width: 260px;
            border-color: rgba(62, 92, 143, 0.5);
            box-shadow: 0 4px 20px rgba(60, 44, 26, 0.16);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            color: var(--ink-faint);
            fill: currentColor;
            pointer-events: none;
        }

        /* --- 登记台（工具栏） --- */
        .toolbar {
            position: fixed;
            bottom: calc(64px + env(safe-area-inset-bottom, 0px));
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            background: var(--paper);
            border: 1px solid rgba(107, 93, 74, 0.16);
            padding: 12px 22px;
            border-radius: 6px;
            box-shadow: 0 10px 30px rgba(60, 44, 26, 0.18);
            z-index: 10000;
            transition: transform var(--dur-short) var(--ease-out);
            animation: toolbarIn 0.6s 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
        }

        @media (max-height: 500px) {
            .toolbar { display: none; }
        }

        .btn {
            border: none;
            background: var(--paper-deep);
            cursor: pointer;
            width: 44px;
            height: 44px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform var(--dur-short) var(--ease-out), box-shadow var(--dur-short) var(--ease-out), color var(--dur-short) var(--ease-out), background var(--dur-short) var(--ease-out);
            color: var(--ink);
            box-shadow: 0 2px 6px rgba(60, 44, 26, 0.14);
        }

        .btn:hover {
            transform: translateY(-2px);
            color: #1D2940;
            box-shadow: 0 5px 14px rgba(60, 44, 26, 0.2);
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* 主 CTA：登记一张（每屏唯一强调色） */
        .btn-primary {
            background: var(--stamp);
            color: #FBF6EA;
        }

        .btn-primary:hover {
            color: #fff;
            background: #B03A26;
        }

        .btn svg {
            height: 22px;
            width: auto;
            max-width: 26px;
            fill: currentColor;
            display: block;
        }

        /* --- 弹窗 --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(43, 34, 22, 0.35);
            backdrop-filter: blur(3px);
            z-index: 20000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity var(--dur-short) var(--ease-out);
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: var(--paper);
            padding: 24px;
            border-radius: 6px;
            width: 90%;
            max-width: 400px;
            border-top: 10px solid var(--spine-yellow);
            box-shadow: 0 20px 60px rgba(43, 34, 22, 0.3);
            transform: translateY(20px) scale(0.92);
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity var(--dur-short) var(--ease-out);
        }

        .modal-overlay.open .modal {
            transform: translateY(0) scale(1);
        }

        .modal h3 {
            margin-bottom: 4px;
            font-size: 19px;
            letter-spacing: 2px;
        }

        .modal-kicker {
            display: block;
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 2px;
            color: var(--stamp);
            margin-bottom: 10px;
        }

        .modal textarea {
            width: 100%;
            height: 100px;
            padding: 10px 12px;
            border: 1px solid rgba(107, 93, 74, 0.3);
            border-radius: 4px;
            resize: none;
            font-size: 16px;
            font-family: inherit;
            line-height: 30px;
            margin: 12px 0 16px;
            outline: none;
            background:
                linear-gradient(var(--card-line) 1px, transparent 1px) 0 0 / 100% 30px,
                var(--paper);
            color: var(--ink);
        }

        .modal textarea:focus {
            border-color: rgba(62, 92, 143, 0.55);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .modal-btn {
            padding: 9px 20px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 15px;
            letter-spacing: 1px;
            transition: transform var(--dur-micro) var(--ease-out), background var(--dur-short) var(--ease-out);
        }

        .modal-btn:active { transform: scale(0.96); }
        .modal-btn.cancel { background: var(--paper-deep); color: var(--ink-soft); border: 1px solid rgba(107, 93, 74, 0.2); }
        .modal-btn.confirm { background: var(--stamp); color: #FBF6EA; }
        .modal-btn.confirm:hover { background: #B03A26; }

        @media (max-width: 768px) {
            .card { width: var(--card-w, 160px); min-height: var(--card-h, 120px); }
            .card-body { padding: 8px 12px 34px; font-size: 15px; line-height: 28px; background-size: 100% 28px; }
            .toolbar { padding: 10px 16px; gap: 10px; bottom: calc(54px + env(safe-area-inset-bottom, 0px)); }
            .btn { width: 44px; height: 44px; }
        }

        /* --- 键盘焦点与选区（全站统一微交互） --- */
        .btn:focus-visible,
        .search-box:focus-visible,
        .modal-btn:focus-visible,
        .undo-btn:focus-visible,
        .undo-close:focus-visible {
            outline: 2px solid var(--color-focus);
            outline-offset: 3px;
        }

        ::selection {
            background: rgba(194, 69, 45, 0.22);
            color: var(--ink);
        }

        /* --- 暗色：夜间档案室 --- */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #191713;
                --grid-color: rgba(235, 214, 140, 0.05);
                --paper: #2A2620;
                --paper-deep: #241F1A;
                --ink: #E6DCC8;
                --ink-soft: #BFB29A;
                --ink-faint: #938570;
                --rule-red: rgba(224, 106, 82, 0.5);
                --card-line: rgba(235, 214, 140, 0.12);
                --stamp: #D96A4E;
                --lend: #8FA9CE;
                --card-shadow: 2px 6px 16px rgba(0, 0, 0, 0.5);
                --card-shadow-drag: 8px 22px 44px rgba(0, 0, 0, 0.65);
            }

            .modal-overlay { background: rgba(10, 8, 5, 0.5); }
            .search-box { border-color: rgba(235, 214, 140, 0.16); }
            .search-box::placeholder { color: rgba(230, 220, 200, 0.35); }
            .btn { box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4); }
            .btn-primary { color: #2A1812; }
        }

        /* --- 空状态 --- */
        .empty-state {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: var(--ink-faint);
            pointer-events: none;
            opacity: 0;
            transition: opacity var(--dur-long) var(--ease-out);
            z-index: 10;
        }

        .empty-state.visible {
            opacity: 1;
        }

        .empty-icon {
            display: block;
            margin-bottom: 12px;
            animation: float 3s ease-in-out infinite;
        }

        .empty-icon svg {
            width: 56px;
            height: 56px;
        }

        .empty-state p {
            font-size: 16px;
            letter-spacing: 2px;
        }

        /* --- 撤销栏 --- */
        .undo-bar {
            position: fixed;
            top: 78px;
            left: 50%;
            transform: translate(-50%, -90px);
            opacity: 0;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(43, 37, 28, 0.94);
            color: #EFE8D6;
            padding: 10px 14px 10px 20px;
            border-radius: 6px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
            z-index: 15000;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity var(--dur-short) var(--ease-out);
        }

        .undo-bar.show {
            transform: translate(-50%, 0);
            opacity: 1;
            pointer-events: auto;
        }

        .undo-text {
            font-size: 14px;
        }

        .undo-btn {
            border: none;
            background: var(--paper);
            color: var(--stamp);
            font-family: inherit;
            font-weight: 700;
            font-size: 13px;
            padding: 6px 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: transform var(--dur-short) var(--ease-out);
        }

        .undo-btn:hover {
            transform: scale(1.05);
        }

        .undo-close {
            border: none;
            background: none;
            color: rgba(239, 232, 214, 0.7);
            font-size: 16px;
            cursor: pointer;
            padding: 4px;
            line-height: 1;
        }

        .undo-close:hover {
            color: #fff;
        }

        /* --- 动画 --- */
        @keyframes toolbarIn {
            0% { opacity: 0; transform: translate(-50%, 20px); }
            100% { opacity: 1; transform: translate(-50%, 0); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* 生成动画 - 弹簧弹出（弹性人格保留） */
        @keyframes popIn {
            0% {
                opacity: 0;
                transform: rotate(calc(var(--angle, 0deg) - 8deg)) scale(0.3);
            }
            55% {
                opacity: 1;
                transform: rotate(calc(var(--angle, 0deg) + 2deg)) scale(1.08);
            }
            75% {
                transform: rotate(calc(var(--angle, 0deg) - 1deg)) scale(0.97);
            }
            90% {
                transform: rotate(var(--angle, 0deg)) scale(1.02);
            }
            100% {
                opacity: 1;
                transform: rotate(var(--angle, 0deg)) scale(1);
            }
        }

        .card.pop-in {
            animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-delay: 0ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div id="board"></div>

    <div class="desk-plate" aria-hidden="true">
        <span class="desk-name">心事借阅处</span>
        <span class="desk-sub">HEART LENDING DESK · 自由取阅 · 随手归还</span>
    </div>

    <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg"><path d="M442.523451 201.280344a241.609739 241.609739 0 0 0-241.243107 241.243107 36.663086 36.663086 0 0 0 36.663086 36.663087 38.496241 38.496241 0 0 0 38.862871-36.663087 163.883996 163.883996 0 0 1 165.71715-163.883995 38.862871 38.862871 0 0 0 0-77.359112z"></path><path d="M1012.634443 958.006445l-231.344074-231.710706A442.156821 442.156821 0 0 0 442.523451 0 442.523451 442.523451 0 0 0 0 442.523451a442.523451 442.523451 0 0 0 442.523451 442.156821 439.957035 439.957035 0 0 0 284.138919-103.389903l230.977444 231.344074a38.862871 38.862871 0 0 0 54.994629-54.627998zM183.315431 700.631579a366.630863 366.630863 0 1 1 256.641604 106.689581 364.064447 364.064447 0 0 1-256.641604-106.689581z"></path></svg>
        <input type="search" class="search-box" id="searchBox" placeholder="检索卡片" autocomplete="off" />
    </div>

    <div class="empty-state" id="emptyState">

                <button class="modal-btn confirm" id="btnConfirmOk">确定</button>

    <script>
        // --- 配置与状态（数据结构与 STORAGE_KEY 与旧版完全兼容） ---
        const STORAGE_KEY = 'sticker_wall_notes_v2';
        const board = document.getElementById('board');
        const modalOverlay = document.getElementById('modalOverlay');
        const noteInput = document.getElementById('noteInput');
        const emptyState = document.getElementById('emptyState');
        const searchEmpty = document.getElementById('searchEmpty');
        const searchBox = document.getElementById('searchBox');
        const undoBar = document.getElementById('undoBar');
        const undoText = document.getElementById('undoText');
        const confirmOverlay = document.getElementById('confirmOverlay');
        const confirmTitle = document.getElementById('confirmTitle');
        const confirmOk = document.getElementById('btnConfirmOk');
        const confirmCancel = document.getElementById('btnConfirmCancel');
        const fileInput = document.getElementById('fileInput');

        // 书脊索引色（做旧）；旧便签色由 normalizeColor 渐进迁移
        const config = {
            colors: ['#EBD68C', '#E8BDC6', '#B5D4BC', '#B0C6E2', '#C9BADE', '#E5C29E'],
            legacyColors: {
                '#fff2a8': '#EBD68C', '#ffd6e0': '#E8BDC6', '#c6f6d5': '#B5D4BC',
                '#bfdbfe': '#B0C6E2', '#e2d1f9': '#C9BADE', '#ffe0c2': '#E5C29E'
            },
            shapes: ['', '', '', 'shape-clip', 'shape-punch', ''],
            sizes: [
                { w: 180, h: 120, label: 'small' },
                { w: 220, h: 140, label: 'medium' },
                { w: 280, h: 180, label: 'large' }
            ],
            presetMessages: [
                '保持好心情', '多喝水哦', '今天辛苦啦', '早点休息', '记得吃水果',
                '加油，你可以的', '祝你顺利', '保持微笑呀', '愿烦恼消失',
                '梦想总会实现', '别忘了深呼吸', '你很棒！', '享受当下',
                '去见想见的人', '听首好听的歌', '抬头看看天空', '一切都会变好',
                '慢慢来，比较快', '今天也要开心', '给生活一点甜', '你已经很努力了',
                '放轻松，没关系', '温柔地对待自己', '好事会发生', '做自己喜欢的事',
                '世界很大，去看看', '感谢自己', '未来可期', '此刻即是礼物'
            ],
            desktopCount: [24, 30],
            mobileCount: [12, 15]
        };

        const state = {
            zIndex: 100,
            cardMap: new WeakMap()
        };

        const undoStack = [];
        let clearing = false;
        let confirmResolver = null;
        let undoBarTimer = null;

        let isMobile = window.innerWidth <= 768;

        // --- 工具函数 ---
        function randomItem(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function randomBetween(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function createId() {
            return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
        }

        function normalizeColor(c) {
            if (!c) return '';
            const k = String(c).toLowerCase();
            return config.legacyColors[k] || c;
        }

        // 由 id 哈希生成稳定卡号（0001-9999），同一张卡永远同号
        function cardNo(id) {
            const s = String(id || '');
            let h = 0;
            for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
            return String((h % 9999) + 1).padStart(4, '0');
        }

        function dateStamp(ts) {
            const d = ts ? new Date(ts) : new Date();
            return d.getFullYear() + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0');
        }

        function getInitialCount() {
            const [min, max] = isMobile ? config.mobileCount : config.desktopCount;
            return randomBetween(min, max);
        }

        function loadNotes() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return null;
                const data = JSON.parse(raw);
                return Array.isArray(data) ? data : null;
            } catch (e) {
                console.error('Failed to load notes', e);
                return null;
            }
        }

        function saveNotes(notes) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
            } catch (e) {
                console.error('Failed to save notes', e);
            }
        }

        function updateEmptyState() {
            const total = board.querySelectorAll('.card:not(.removing)').length;
            const visible = board.querySelectorAll('.card:not(.removing):not(.hidden)').length;
            const searching = searchBox.value.trim() !== '';
            emptyState.classList.toggle('visible', total === 0);
            searchEmpty.classList.toggle('visible', total > 0 && visible === 0 && searching);
        }

        function applySearch() {
            const q = searchBox.value.trim().toLowerCase();
            board.querySelectorAll('.card').forEach(card => {
                const text = (card.querySelector('.card-body').textContent || '').toLowerCase();
                card.classList.toggle('hidden', q !== '' && !text.includes(q));
            });
            updateEmptyState();
        }

        // --- 初始化 ---
        function init() {
            const saved = loadNotes();

            if (saved) {
                saved.forEach((note, index) => {
                    createCard({
                        ...note,
                        animateDelay: Math.min(index * 35, 1200)
                    });
                });
            } else {
                const count = getInitialCount();
                const notes = [];
                for (let i = 0; i < count; i++) {
                    const note = createPresetNote();
                    notes.push(note);
                    createCard({ ...note, animateDelay: Math.min(i * 40, 1200) });
                }
                saveNotes(notes);
            }

            updateEmptyState();

            setupControls();

            window.addEventListener('resize', () => {
                isMobile = window.innerWidth <= 768;
            });
        }

        function getCardSize(shape = '', sizeLabel = '') {
            const size = config.sizes.find(s => s.label === sizeLabel) || config.sizes[1];
            if (isMobile) {
                return { w: Math.round(size.w * 0.75), h: Math.round(size.h * 0.75) };
            }
            return { w: size.w, h: size.h };
        }

        function getSizeForText(text) {
            const len = (text || '').length;
            if (len <= 8) return 'small';
            if (len <= 20) return 'medium';
            return 'large';
        }

        function getEdgeMargin(w, h) {
            if (isMobile) {
                return { marginW: Math.round(w / 4), marginH: Math.round(h / 4) };
            }
            return { marginW: 0, marginH: 0 };
        }

        function randomPosition(w, h) {
            const { marginW, marginH } = getEdgeMargin(w, h);
            return {
                x: -marginW + Math.random() * (window.innerWidth - w + marginW * 2),
                y: -marginH + Math.random() * (window.innerHeight - h + marginH * 2)
            };
        }

        function overlapsAny(x, y, w, h) {
            const tolerance = 8;
            return [...board.querySelectorAll('.card:not(.removing)')].some(card => {
                const cx = parseFloat(card.style.left);
                const cy = parseFloat(card.style.top);
                const cw = card.offsetWidth || w;
                const ch = card.offsetHeight || h;
                const overlapX = x + w - tolerance > cx && cx + cw - tolerance > x;
                const overlapY = y + h - tolerance > cy && cy + ch - tolerance > y;
                return overlapX && overlapY;
            });
        }

        function findFreePosition(w, h) {
            for (let i = 0; i < 30; i++) {
                const pos = randomPosition(w, h);
                if (!overlapsAny(pos.x, pos.y, w, h)) return pos;
            }
            return randomPosition(w, h);
        }

        function createPresetNote() {
            const shape = randomItem(config.shapes);
            const text = randomItem(config.presetMessages);
            const sizeLabel = getSizeForText(text);
            const { w, h } = getCardSize(shape, sizeLabel);
            const pos = findFreePosition(w, h);

            return {
                id: createId(),
                text: text,
                x: pos.x,
                y: pos.y,
                color: randomItem(config.colors),
                shape: shape,
                size: sizeLabel,
                angle: (Math.random() - 0.5) * 12,
                createdAt: Date.now()
            };
        }

        // --- 创建卡片 ---
        function createCard(options = {}) {
            const { id, text, x, y, color, shape, size, angle, createdAt, animateDelay = 0 } = options;

            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.id = id ?? '';
            card.dataset.color = color || '';
            card.dataset.shape = shape || '';
            card.dataset.size = size || '';
            if (shape) card.classList.add(shape);
            card.style.setProperty('--angle', `${angle ?? 0}deg`);
            const spineColor = normalizeColor(color) || randomItem(config.colors);
            card.style.setProperty('--spine', spineColor);
            const sizeLabel = size || getSizeForText(text);
            const { w: cardW, h: cardH } = getCardSize(shape, sizeLabel);
            card.style.setProperty('--card-w', `${cardW}px`);
            card.style.setProperty('--card-h', `${cardH}px`);
            card.style.left = `${x ?? 10}px`;
            card.style.top = `${y ?? 10}px`;
            card.style.zIndex = ++state.zIndex;
            if (animateDelay) card.style.animationDelay = `${animateDelay}ms`;

            card.innerHTML = `
                <svg class="card-clip" viewBox="0 0 22 26" aria-hidden="true"><path d="M17 5v14a4 4 0 0 1-8 0V7a2.5 2.5 0 0 1 5 0v11a1 1 0 0 1-2 0V8" fill="none" stroke="#8A93A6" stroke-width="1.8" stroke-linecap="round"/></svg>
                <div class="card-head">
                    <span class="card-no">NO.${cardNo(id)}</span>
                    <span class="card-date">${dateStamp(createdAt)}</span>
                    <span class="card-close" title="删除" role="button" aria-label="删除这张卡片">×</span>
                </div>
                <div class="card-rule"></div>
                <div class="card-body"></div>
            `;
            card.querySelector('.card-body').textContent = text ?? '';

            board.appendChild(card);

            state.cardMap.set(card, {
                id,
                angle: angle ?? 0,
                color: spineColor,
                shape: shape || '',
                size: sizeLabel,
                createdAt: createdAt || Date.now(),
                currentX: x ?? 10,
                currentY: y ?? 10,
                isDragging: false
            });

            setupInteractions(card);

            requestAnimationFrame(() => {
                card.classList.add('appear', 'pop-in');
            });

            return card;
        }

        // --- 交互逻辑 ---
        function setupInteractions(card) {
            const closeBtn = card.querySelector('.card-close');

            card.addEventListener('pointerdown', () => {
                card.style.zIndex = ++state.zIndex;
            });

            card.addEventListener('pointerdown', startDrag);

            closeBtn.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                removeCard(card);
            });

            card.addEventListener('dblclick', () => removeCard(card));
        }

        function removeCard(card) {
            if (card.classList.contains('removing')) return;
            const note = noteFromCard(card);
            card.classList.remove('pop-in');
            card.style.transition = '';
            card.style.setProperty('--rm-angle', `${(Math.random() - 0.5) * 14}deg`);
            card.classList.add('removing');
            setTimeout(() => {
                card.remove();
                updateEmptyState();
                saveAllNotes();
                pushUndoBatch([note], '已删除 1 张卡片');
            }, 300);
        }

        // --- 拖拽核心 ---
        function startDrag(e) {
            const card = e.currentTarget;
            if (e.target.classList.contains('card-close')) return;

            const cardState = state.cardMap.get(card);
            if (!cardState) return;

            e.preventDefault();
            card.classList.remove('pop-in');
            card.classList.add('dragging');
            card.style.transition = '';
            cardState.isDragging = true;

            const startX = e.clientX;
            const startY = e.clientY;
            const initialLeft = parseFloat(card.style.left);
            const initialTop = parseFloat(card.style.top);

            function onMove(e) {
                if (!cardState.isDragging) return;

                const dx = e.clientX - startX;
                const dy = e.clientY - startY;

                cardState.currentX = initialLeft + dx;
                cardState.currentY = initialTop + dy;

                card.style.left = `${cardState.currentX}px`;
                card.style.top = `${cardState.currentY}px`;
            }

            function onUp() {
                cardState.isDragging = false;
                card.classList.remove('dragging');

                const rect = card.getBoundingClientRect();
                const winW = window.innerWidth;
                const winH = window.innerHeight;
                const { marginW, marginH } = getEdgeMargin(rect.width, rect.height);

                let finalX = cardState.currentX;
                let finalY = cardState.currentY;

                if (finalX < -marginW) finalX = -marginW;
                if (finalX > winW - rect.width + marginW) finalX = winW - rect.width + marginW;
                if (finalY < -marginH) finalY = -marginH;
                if (finalY > winH - rect.height + marginH) finalY = winH - rect.height + marginH;

                if (finalX !== cardState.currentX || finalY !== cardState.currentY) {
                    card.style.transition = 'left 0.3s ease, top 0.3s ease';
                    card.style.left = `${finalX}px`;
                    card.style.top = `${finalY}px`;

                    setTimeout(() => {
                        card.style.transition = '';
                    }, 300);
                }

                cardState.currentX = finalX;
                cardState.currentY = finalY;
                saveAllNotes();

                document.removeEventListener('pointermove', onMove);
                document.removeEventListener('pointerup', onUp);
                document.removeEventListener('pointercancel', onUp);
            }

            document.addEventListener('pointermove', onMove);
            document.addEventListener('pointerup', onUp);
            document.addEventListener('pointercancel', onUp);
        }

        // --- 登记台控制 ---
        function setupControls() {
            document.getElementById('btnAdd').addEventListener('click', () => {
                modalOverlay.classList.add('open');
                noteInput.value = '';
                setTimeout(() => noteInput.focus(), 100);
            });

            document.getElementById('btnClear').addEventListener('click', async () => {
                const cards = [...board.querySelectorAll('.card:not(.removing)')];
                if (cards.length === 0) return;
                const ok = await showConfirm('确定要清空整个目录柜吗？');
                if (!ok) return;

                clearing = true;
                pushUndoBatch(collectNotes(), `已清空 ${cards.length} 张卡片`);
                cards.forEach((card, i) => {
                    setTimeout(() => {
                        card.classList.remove('pop-in');
                        card.style.setProperty('--rm-angle', `${(Math.random() - 0.5) * 18}deg`);
                        card.classList.add('removing');
                        setTimeout(() => card.remove(), 300);
                    }, i * 35 + Math.random() * 60);
                });
                setTimeout(() => {
                    clearing = false;
                    saveAllNotes();
                    updateEmptyState();
                }, Math.max(0, (cards.length - 1) * 35 + 60) + 350);
            });

            document.getElementById('btnUndo').addEventListener('click', undoLast);

            document.getElementById('btnRandom').addEventListener('click', () => {
                const notes = [];
                for (let i = 0; i < 5; i++) {
                    const note = createPresetNote();
                    notes.push(note);
                    createCard({ ...note, animateDelay: Math.min(i * 60, 400) });
                }
                saveAllNotes();
                applySearch();
            });

            document.getElementById('btnUndoClose').addEventListener('click', closeUndoBar);

            document.getElementById('btnExport').addEventListener('click', () => {
                const notes = collectNotes();
                if (notes.length === 0) return;
                const blob = new Blob([JSON.stringify(notes, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                const d = new Date();
                a.download = `bianqian-${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}.json`;
                a.click();
                URL.revokeObjectURL(url);
            });

            document.getElementById('btnImport').addEventListener('click', () => fileInput.click());

            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
try {
                            const data = JSON.parse(reader.result);
                            if (!Array.isArray(data)) throw new Error('invalid');
                            if (data.length > 2000) {
                                alert('备份文件过大（超过 2000 条），已取消导入');
                                return;
                            }
                            let i = 0;
                            const step = 20;
                            const next = () => {
                                const end = Math.min(i + step, data.length);
                                for (; i < end; i++) {
                                    createCard({ ...data[i], animateDelay: Math.min((i % step) * 30, 400) });
                                }
                                if (i < data.length) {
                                    requestAnimationFrame(next);
                                } else {
                                    saveAllNotes();
                                    applySearch();
                                }
                            };
                            next();
                        } catch (err) {
                            alert('导入失败：文件格式不正确');
                        }
                };
                reader.readAsText(file);
                e.target.value = '';
            });

            searchBox.addEventListener('input', applySearch);

            confirmOk.addEventListener('click', () => resolveConfirm(true));
            confirmCancel.addEventListener('click', () => resolveConfirm(false));
            confirmOverlay.addEventListener('click', (e) => {
                if (e.target === confirmOverlay) resolveConfirm(false);
            });

            document.getElementById('btnCancel').addEventListener('click', () => {
                modalOverlay.classList.remove('open');
            });

            document.getElementById('btnConfirm').addEventListener('click', () => {
                const text = noteInput.value.trim();
                if (text) {
                    if (text.length > 30) {
                        alert('卡片不能超过 30 字');
                        return;
                    }
                    const note = createPresetNote();
                    note.text = text;
                    note.id = createId();
                    note.createdAt = Date.now();
                    note.size = getSizeForText(text);

                    const { w: cardW, h: cardH } = getCardSize(note.shape, note.size);
                    const cx = window.innerWidth / 2 - cardW / 2;
                    const cy = window.innerHeight / 2 - cardH / 2;
                    let posX = Math.max(10, Math.min(window.innerWidth - cardW - 10, cx));
                    let posY = Math.max(10, Math.min(window.innerHeight - cardH - 80, cy));
                    for (let i = 0; i < 15; i++) {
                        const px = cx + (Math.random() * 160 - 80);
                        const py = cy + (Math.random() * 160 - 80);
                        const clampedX = Math.max(10, Math.min(window.innerWidth - cardW - 10, px));
                        const clampedY = Math.max(10, Math.min(window.innerHeight - cardH - 80, py));
                        if (!overlapsAny(clampedX, clampedY, cardW, cardH)) {
                            posX = clampedX;
                            posY = clampedY;
                            break;
                        }
                    }
                    note.x = posX;
                    note.y = posY;

                    createCard({ ...note, animateDelay: 0 });
                    saveAllNotes();
                    applySearch();
                }
                modalOverlay.classList.remove('open');
            });

            modalOverlay.addEventListener('click', (e) => {
                if (e.target === modalOverlay) modalOverlay.classList.remove('open');
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    modalOverlay.classList.remove('open');
                    resolveConfirm(false);
                }
            });

            noteInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    document.getElementById('btnConfirm').click();
                }
            });
        }

        // --- 本地存储 ---
        function noteFromCard(card) {
            const cardState = state.cardMap.get(card);
            return {
                id: cardState?.id ?? createId(),
                text: card.querySelector('.card-body').textContent,
                x: parseFloat(card.style.left),
                y: parseFloat(card.style.top),
                color: cardState?.color || card.dataset.color || '',
                shape: cardState?.shape || card.dataset.shape || '',
                size: cardState?.size || card.dataset.size || getSizeForText(card.querySelector('.card-body').textContent),
                angle: cardState?.angle ?? 0,
                createdAt: cardState?.createdAt || Date.now()
            };
        }

        function collectNotes() {
            const notes = [];
            board.querySelectorAll('.card:not(.removing)').forEach(card => {
                notes.push(noteFromCard(card));
            });
            return notes;
        }

        function saveAllNotes() {
            saveNotes(collectNotes());
        }

        // --- 撤销栈 ---
        function pushUndoBatch(notes, message) {
            undoStack.push({ notes, message });
            showUndoBar(message);
        }

        function undoLast() {
            if (clearing) return;
            const batch = undoStack.pop();
            if (!batch) return;

            batch.notes.forEach((note, index) => {
                createCard({ ...note, animateDelay: Math.min(index * 35, 800) });
            });
            saveAllNotes();
            applySearch();

            if (undoStack.length > 0) {
                showUndoBar(`已恢复上一步（还可撤销 ${undoStack.length} 步）`);
            } else {
                hideUndoBar();
            }
        }

        function closeUndoBar() {
            clearTimeout(undoBarTimer);
            undoStack.length = 0;
            hideUndoBar();
        }

        // --- 提示条与确认弹窗 ---
        function showUndoBar(message) {
            clearTimeout(undoBarTimer);
            undoText.textContent = message;
            undoBar.classList.add('show');
            undoBarTimer = setTimeout(() => hideUndoBar(), 6000);
        }

        function hideUndoBar() {
            undoBar.classList.remove('show');
        }

        function showConfirm(message) {
            return new Promise(resolve => {
                confirmResolver = resolve;
                confirmTitle.textContent = message;
                confirmOverlay.classList.add('open');
            });
        }

        function resolveConfirm(result) {
            if (!confirmResolver) return;
            confirmOverlay.classList.remove('open');
            confirmResolver(result);
            confirmResolver = null;
        }

        init();
    </script>
</body>
</html>
